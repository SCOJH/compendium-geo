name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NET10-01 — global.json pins the .NET 10 SDK, which builds both targets;
      # the .NET 9 SDK is here for its runtime, without which the net9.0 half of
      # the test project has nothing to run on.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Runs the test project once per target (net9.0 and net10.0). LogFilePrefix
      # gives one .trx per target; a fixed LogFileName made the second run
      # overwrite the first.
      - name: Test (with coverage, net9.0 and net10.0)
        run: |
          dotnet test -c Release --no-build \
            --filter "FullyQualifiedName!~IntegrationTests" \
            --logger "trx;LogFilePrefix=test-results" \
            --results-directory TestResults/ \
            --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 14

      - name: Coverage report + 75% gate
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator \
            -reports:'TestResults/**/coverage.cobertura.xml' \
            -targetdir:coverage-report \
            -reporttypes:'TextSummary;MarkdownSummary'
          cat coverage-report/Summary.txt
          # Fail if line coverage < 75% on the unit-testable surface.
          # Baseline at repo assembly (2026-07-25): 76.9% line coverage.
          # Raise this gate as the domain grows tests — never lower it.
          line_pct=$(awk '/^[[:space:]]*Line coverage:/ {gsub("%","",$NF); print $NF; exit}' coverage-report/Summary.txt)
          echo "Line coverage: ${line_pct}%"
          awk -v c="$line_pct" 'BEGIN { exit (c+0 >= 75) ? 0 : 1 }'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14
